name: CI

on:
  push:
    branches: [main, iocp-windows]
  pull_request:
    branches: [main, iocp-windows]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # co2（无栈协程库）作为兄弟目录检出；CMake 的 NET_CO2_DIR 指向它。
  CO2_REPOSITORY: lvyues1994/coro
  CO2_REF: main

jobs:
  build:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }} (${{ matrix.allocator }} frames)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            build_type: Debug
            allocator: new_delete
          - compiler: g++
            build_type: Release
            allocator: new_delete
          - compiler: g++
            build_type: Debug
            allocator: recycling
          - compiler: clang++
            build_type: Debug
            allocator: new_delete
            packages: clang
          - compiler: clang++
            build_type: Release
            allocator: recycling
            packages: clang
    steps:
      - uses: actions/checkout@v4

      - name: Check out co2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CO2_REPOSITORY }}
          ref: ${{ env.CO2_REF }}
          path: co2

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev ${{ matrix.packages }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DNET_CO2_DIR=$GITHUB_WORKSPACE/co2 \
            -DNET_TLS_PROVIDER=OpenSSL \
            -DNET_DEFAULT_FRAME_ALLOCATOR=${{ matrix.allocator }}

      - name: Build
        run: cmake --build build

      - name: Test
        # io_uring 变体在内核 / 沙箱不允许时以 77 退出，CTest 记为 skipped。
        run: ctest --test-dir build --output-on-failure --timeout 120

  msvc:
    name: MSVC ${{ matrix.build_type }} (IOCP)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Check out co2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CO2_REPOSITORY }}
          ref: ${{ env.CO2_REF }}
          path: co2

      # cl 的 error / warning 行变成注解：没有日志权限也能从 check-runs API 读到。
      - name: Register MSVC problem matcher
        run: echo "::add-matcher::.github/matchers/msvc.json"

      # runner 镜像自带 OpenSSL 3（C:\Program Files\OpenSSL）；没有就用 choco 装。DLL 目录进 PATH 供测试运行。
      - name: Locate OpenSSL
        id: openssl
        shell: pwsh
        run: |
          $candidates = @("C:\Program Files\OpenSSL", "C:\Program Files\OpenSSL-Win64")
          $root = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $root) {
            choco install openssl -y --no-progress
            $root = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          }
          if (-not $root) { throw "OpenSSL not found on the runner" }
          "root=$root" >> $env:GITHUB_OUTPUT
          "$root\bin" >> $env:GITHUB_PATH
          Write-Host "OpenSSL at $root"

      # Visual Studio 生成器是多配置的：配置阶段不指定类型，构建与测试时用 --config / -C。
      # 基准关掉（需要 Boost.Asio）。
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DNET_CO2_DIR="${{ github.workspace }}/co2"
          -DNET_TLS_PROVIDER=OpenSSL
          -DOPENSSL_ROOT_DIR="${{ steps.openssl.outputs.root }}"
          -DNET_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Report failed tests as annotations
        if: failure()
        shell: bash
        run: python .github/scripts/annotate_ctest.py build/Testing/Temporary/LastTest.log

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
            env: ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
            prefix: ""
          - name: TSan
            flags: -fsanitize=thread -fno-omit-frame-pointer
            # suppressions：只抑制未插桩的 libcrypto / libssl 内部（见 tests/tsan.supp）
            env: TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1:suppressions=$GITHUB_WORKSPACE/tests/tsan.supp
            # 新内核的 ASLR 布局与 TSan 的影子内存冲突：关掉本进程的 ASLR。
            prefix: setarch x86_64 -R
    steps:
      - uses: actions/checkout@v4

      - name: Check out co2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CO2_REPOSITORY }}
          ref: ${{ env.CO2_REF }}
          path: co2

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}" \
            -DNET_CO2_DIR=$GITHUB_WORKSPACE/co2 \
            -DNET_TLS_PROVIDER=OpenSSL \
            -DNET_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          set +e # 逐个运行并自行判定退出码（77 = 跳过，契约违规测试预期 abort）
          export ${{ matrix.env }}
          cd build/tests
          status=0
          for test in $(ctest -N | sed -n 's/^ *Test *#[0-9]*: //p'); do
            echo "::group::$test"
            ${{ matrix.prefix }} ./$test
            code=$?
            echo "::endgroup::"
            if [ $code -eq 77 ]; then
              echo "skipped: $test"
            elif [ $code -ne 0 ]; then
              case "$test" in
                *contract_violation*) echo "expected abort: $test" ;;
                *) echo "::error::$test failed with exit code $code"; status=1 ;;
              esac
            fi
          done
          exit $status

  boringssl:
    name: BoringSSL provider
    runs-on: ubuntu-latest
    env:
      BORINGSSL_TAG: 0.20250701.0
    steps:
      - uses: actions/checkout@v4

      - name: Check out co2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CO2_REPOSITORY }}
          ref: ${{ env.CO2_REF }}
          path: co2

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # BoringSSL 从源码构建（约 400 个目标，不需要 Go / Perl）；按标签缓存构建产物。
      - name: Cache BoringSSL
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/boringssl-src
            build/_deps/boringssl-build
            build/_deps/boringssl-subbuild
          key: boringssl-${{ env.BORINGSSL_TAG }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNET_CO2_DIR=$GITHUB_WORKSPACE/co2 \
            -DNET_TLS_PROVIDER=BoringSSL \
            -DNET_BORINGSSL_GIT_TAG=$BORINGSSL_TAG \
            -DNET_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  wolfssl:
    name: wolfSSL provider
    runs-on: ubuntu-latest
    env:
      WOLFSSL_TAG: v5.8.2-stable
    steps:
      - uses: actions/checkout@v4

      - name: Check out co2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CO2_REPOSITORY }}
          ref: ${{ env.CO2_REF }}
          path: co2

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # wolfSSL 从源码构建（要 OpenSSL 兼容层的那组开关，发行版的包不带）；按标签缓存。
      - name: Cache wolfSSL
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/wolfssl-src
            build/_deps/wolfssl-build
            build/_deps/wolfssl-subbuild
          key: wolfssl-${{ env.WOLFSSL_TAG }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNET_CO2_DIR=$GITHUB_WORKSPACE/co2 \
            -DNET_TLS_PROVIDER=wolfSSL \
            -DNET_WOLFSSL_GIT_TAG=$WOLFSSL_TAG \
            -DNET_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  benchmarks:
    name: Benchmarks (quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out co2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CO2_REPOSITORY }}
          ref: ${{ env.CO2_REF }}
          path: co2

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libboost-dev libuv1-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNET_CO2_DIR=$GITHUB_WORKSPACE/co2 \
            -DNET_TLS_PROVIDER=OpenSSL \
            -DNET_BUILD_TESTS=OFF \
            -DNET_BUILD_EXAMPLES=OFF \
            -DNET_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build

      # 结果文件开头记下提交号与 CPU 型号（比较脚本据此判断同一提交 / 同一机型）；整套跑三遍，比较时同名行
      # 取最小值——单遍时同一颗核上 TCP 往返行两次运行能差 17%，三遍取最小压到 3% 左右。
      - name: Run
        run: |
          cd build/benchmarks
          {
            echo "# sha=${GITHUB_SHA}"
            echo "# cpu=$(LC_ALL=C lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            echo "# nproc=$(nproc)"
            for pass in 1 2 3; do
              echo "# pass=${pass}"
              ./bench_core --quick
              ./bench_net --quick
              ./bench_tls --quick
              if [ -x ./bench_asio ]; then ./bench_asio --quick; fi
              if [ -x ./bench_libuv ]; then ./bench_libuv --quick; fi
            done
          } | tee ../../benchmark-results.txt
          {
            echo '## Benchmarks (quick mode, 3 passes, shared CI runner: numbers are indicative only)'
            echo '<details><summary>raw output</summary>'
            echo
            echo '```'
            cat ../../benchmark-results.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # 回归门：与 main 上最近一次成功运行的 artifact 逐行比（warning 注解，不让作业失败）。共享 runner 每次可能是
      # 不同机型，所以按同一次运行里 Asio / libuv 参照行的变化扣掉机器快慢再判断；同一提交重跑不报警。
      # 规则与验证见 .github/scripts/compare_benchmarks.py 开头。
      - name: Fetch previous results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -n benchmark-results -D previous || echo "no benchmark-results artifact on run $run_id"
          else
            echo "no previous successful run on main"
          fi

      - name: Compare with previous
        run: >
          python3 .github/scripts/compare_benchmarks.py previous/benchmark-results.txt benchmark-results.txt
          --threshold 0.15 --cross-machine-threshold 0.25 >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt

  coverage:
    name: Coverage (gcovr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out co2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CO2_REPOSITORY }}
          ref: ${{ env.CO2_REF }}
          path: co2

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev
          pip install 'gcovr==7.2'

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DNET_CO2_DIR=$GITHUB_WORKSPACE/co2 \
            -DNET_TLS_PROVIDER=OpenSSL \
            -DNET_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

      # 只统计本库的 include/ 与 src/（不含 co2、系统头、测试本身）。同一份源码为四个后端各编一个测试变体，
      # gcov 对重复的 .gcda 会报 stamp / 解析警告：忽略，不让报告因此失败。
      - name: Report
        run: |
          mkdir -p coverage
          gcovr --root . --filter include/ --filter src/ \
            --gcov-ignore-parse-errors=all --gcov-ignore-errors=all \
            --exclude-unreachable-branches --exclude-throw-branches \
            --print-summary \
            --xml coverage.xml --html-details coverage/index.html \
            --txt coverage.txt
          {
            echo '## Coverage (gcovr, GCC Debug, all Linux backends)'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.txt
            coverage/
